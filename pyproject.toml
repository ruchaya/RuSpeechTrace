[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "russian-speech-source-attribution"
version = "0.1.0"
description = "Open-set source attribution of Russian synthetic speech"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "librosa>=0.10.2",
  "soundfile>=0.12",
  "resampy>=0.4.3",
  "lightgbm>=4.3",
  "torch>=2.2",
  "torchaudio>=2.2",
  "transformers>=4.42",
  "datasets>=2.20",
  "huggingface_hub>=0.23",
  "shap>=0.45",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "PyYAML>=6.0",
  "joblib>=1.4",
  "pyarrow>=15",
  "openpyxl>=3.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
