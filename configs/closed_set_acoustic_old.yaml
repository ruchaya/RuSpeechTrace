experiment:
  name: closed_set_acoustic_lightgbm
  seed: 42
  output_root: results/raw
model:
  type: lightgbm
  params:
    objective: multiclass
    learning_rate: 0.03
    num_leaves: 31
    n_estimators: 2000
    colsample_bytree: 0.9
    subsample: 0.9
    reg_lambda: 1.0
    verbosity: -1
feature_selection:
  include_prefixes: [spectral_, prosody_]
  exclude_columns: []
  exclude_duration: false
training:
  early_stopping_rounds: 80
statistics:
  seeds: [42, 123, 456, 789, 2026]
