experiment:
  name: same_sr_22050_control
  seed: 42
  output_root: results/raw
  summary_root: results/summaries
  status: posthoc_shortcut_diagnostic

control:
  native_sample_rate: 22050
  generators:
    - TeraTTS
    - g2pTTS
    - girl_nice
    - glados
    - glados2
    - piperTTS
    - pyx3TTS
    - rfsTTS
    - tts_ru_hifigan_ruslan
    - tts_transformer-ru-cv7_css10
    - vits2TTS
    - voskTTS

model:
  type: lightgbm
  params:
    objective: multiclass
    learning_rate: 0.03
    num_leaves: 31
    n_estimators: 2000
    colsample_bytree: 0.9
    subsample: 0.9
    reg_lambda: 1.0
    verbosity: -1

training:
  early_stopping_rounds: 80