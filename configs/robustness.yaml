experiment:
  name: robustness_acoustic
  seed: 42
  output_root: results/raw
model:
  type: lightgbm
  params:
    objective: multiclass
    learning_rate: 0.03
    num_leaves: 31
    n_estimators: 1500
    verbosity: -1
feature_selection:
  include_prefixes: [spectral_, prosody_]
robustness:
  clean_labels: [raw, clean, none, ""]
  distortion_column: augmentation_type
