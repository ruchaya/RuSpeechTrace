experiment:
  name: same_sr_16000_control
  seed: 42
  output_root: results/raw
  summary_root: results/summaries
  status: posthoc_shortcut_diagnostic

control:
  native_sample_rate: 16000
  generators:
    - mms_tts_rus
    - t5TTS
    - tts_ru_free_hf_vits_high_multispeaker
    - tts_ru_free_hf_vits_low_multispeaker
    - tts_vits_ru_hf

model:
  type: lightgbm
  params:
    objective: multiclass
    learning_rate: 0.03
    num_leaves: 31
    n_estimators: 2000
    colsample_bytree: 0.9
    subsample: 0.9
    reg_lambda: 1.0
    verbosity: -1

training:
  early_stopping_rounds: 80